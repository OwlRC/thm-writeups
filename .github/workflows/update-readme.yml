name: Auto Update README

on:
  push:
    paths:
      - 'easy/**.md'
      - 'medium/**.md'
      - 'hard/**.md'
      - 'info/**.md'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Generate README
        run: python scripts/generate_readme.py

      - name: Commit and push if changed
        run: |
          git config user.name "OwlRC Bot"
          git config user.email "actions@github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "🦉 Auto-update README [$(date +'%Y-%m-%d')]"
          git push
